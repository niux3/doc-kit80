[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "niux3",email = "renaudbourdeau@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlmodel (>=0.0.42,<0.0.43)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "httpx2 (>=2.12.0,<3.0.0)"
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
