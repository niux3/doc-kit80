<div class="row">
  <div class="form-group col-md-6 mt-3">
    <label for="title">Titre</label>
    <input type="text" class="form-control" id="title" name="title" required value="[[= data.title ? data.title : '' ]]">
  </div>
  <div class="form-group col-md-6 mt-3">
    <label for="slug">Slug</label>
    <ui-slug id="slug" name="slug" className="form-control" readonly required relation="title" />
  </div>
  <div class="form-group col-md-12 mt-3">
    <ui-markdown-edit name="content" required value="[[= data.content ? data.content : '' ]]" />
  </div>
  <div class="form-group col-md-4 mt-3" style="display: flex; justify-content: center; align-items: center;">
    <div class="form-check">
      <input type="checkbox" class="form-check-input" id="online" name="online" required value="1" checked>
      <label class="form-check-label" for="online">En ligne</label>
    </div>
  </div>
  <div class="form-group col-md-4 mt-3">
    <label for="language_id">Langue</label>
    <select class="form-select" id="language_id" name="language_id" required>
      <option value=""></option>
      [[ for (const language of languages) { ]]
        [[ if(language.id === data.language_id){ ]]
        <option value="[[= language.id ]]" selected>[[= language.name ]]</option>
        [[ } else { ]]
        <option value="[[= language.id ]]">[[= language.name ]]</option>
        [[ } ]]
      [[ } ]]
    </select>
  </div>
  <div class="form-group col-md-4 mt-3">
    <label for="category_id">Parent</label>
    <select class="form-select" id="category_id" name="category_id" required>
      <option value=""></option>
      [[ for (const category of categories) { ]]
        [[ if(category.id === data.category_id){ ]]
        <option value="[[= category.id ]]" selected>[[= category.name ]]</option>
        [[ } else { ]]
        <option value="[[= category.id ]]">[[= category.name ]]</option>
        [[ } ]]
      [[ } ]]
    </select>
  </div>
</div>
