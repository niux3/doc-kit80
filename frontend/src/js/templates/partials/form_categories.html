<div class="row">
  [[ if(typeof languages !== 'undefined' && languages.length > 0){]]
  <div class="form-group col-md-12 mt-3">
    <label for="language_id">Langue</label>
    <select class="form-select" id="language_id" name="language_id" required>
      <option value="">choisir une langue</option>
      [[ for (const language of languages) { ]]
      <option value="[[= language.id ]]">[[= language.name ]]</option>
      [[ } ]]
    </select>
  </div>
  [[ } ]]

  <div class="form-group col-md-6 mt-3">
    <label for="name">Name</label>
    <input type="text" class="form-control" id="name" name="name" required value="">
  </div>
  <div class="form-group col-md-6 mt-3">
    <label for="description">Description</label>
    <input type="text" class="form-control" id="description" name="description" value="">
  </div>
  <div class="form-group col-md-4 mt-3">
    <label for="lft">lft</label>
    <input type="text" class="form-control" id="lft" name="lft" required value="">
  </div>
  <div class="form-group col-md-4 mt-3">
    <label for="rgt">rgt</label>
    <input type="text" class="form-control" id="rgt" name="rgt" required value="">
  </div>

  [[ if(typeof categories !== 'undefined'){]]
  <div class="form-group col-md-4 mt-3">
    <label for="parent_id">Parent</label>
    <select class="form-select" id="parent_id" name="parent_id">
      <option value="">choisir une catégorie</option>
      [[ for (const category of categories) { ]]
      <option value="[[= category.id ]]">[[= category.name ]]</option>
      [[ } ]]
    </select>
  </div>
  [[ } ]]

</div>
